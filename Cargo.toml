[package]
name = "disk-cleaner"
version = "0.6.0"
edition = "2024"
default-run = "disk-cleaner"

[features]
default = []
internal-tools = []

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
bytesize = "2"
trash = "5"
rfd = "0.17"
dirs = "7"
serde_json = "1"
libc = "0.2"
rayon = "1.11.0"
mimalloc = "0.1.52"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }
raw-window-handle = "0.6"
smallvec = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
dirs = "7"

[[bench]]
name = "scan_bench"
harness = false

[[bench]]
name = "tree_bench"
harness = false

[[bench]]
name = "treemap_bench"
harness = false

[[bench]]
name = "regression_bench"
harness = false

[[bench]]
name = "stat_bench"
harness = false

[profile.bench]
inherits = "release-dist"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"

[profile.release-dist]
inherits = "release"
lto = true

[[bin]]
name = "disk-cleaner"
path = "src/main.rs"
bench = false

[[bin]]
name = "scan_only"
path = "src/bin/scan_only.rs"
bench = false
required-features = ["internal-tools"]

[[bin]]
name = "bench_perf"
path = "src/bin/bench_perf.rs"
bench = false
required-features = ["internal-tools"]

[[bin]]
name = "ntfs_probe"
path = "src/bin/ntfs_probe.rs"
bench = false
required-features = ["internal-tools"]

[[bin]]
name = "ntfs_size_probe"
path = "src/bin/ntfs_size_probe.rs"
bench = false
required-features = ["internal-tools"]

[[bin]]
name = "ntfs_mft_probe"
path = "src/bin/ntfs_mft_probe.rs"
bench = false
required-features = ["internal-tools"]

[[bin]]
name = "ntfs_mft_index_probe"
path = "src/bin/ntfs_mft_index_probe.rs"
bench = false
required-features = ["internal-tools"]

[[bin]]
name = "mft_diff"
path = "src/bin/mft_diff.rs"
bench = false
required-features = ["internal-tools"]
